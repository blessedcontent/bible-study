name: Send Daily Study Notification

on:
  schedule:
    # Frequent checks recover from delayed or skipped starts. The sender uses
    # each registration's time zone and once-per-local-day Firestore marker.
    - cron: '7,37 * * * *'
      timezone: 'America/Chicago'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: read

concurrency:
  group: daily-study-notifications
  cancel-in-progress: false

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test notification title decoding
        run: node --test scripts/decode-html-entities.test.js

      - name: Install dependencies
        run: npm install firebase-admin@12 google-auth-library@9

      - name: Send push notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-notification.js
