name: Publish Daily Bible Study

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tools/**'
  schedule:
    # Preserve the half-hour checks at :07 and :37 Central.
    - cron: '7,37 * * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate promotion, build, live checks and runway without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-review-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

env:
  RELEASE_DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Queued releases must see the latest committed promotion.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate reader JavaScript and release behavior
        run: |
          node --check assets/notifications-ea704e45.js
          node --check assets/reader-controls-c8d1b1b6.js
          node --check assets/verse-popover-a4ca0f9c.js
          node --check assets/archive-search-6fcac06e.js
          node --check assets/full-text-search-8eef895a.js
          node --check assets/privacy-controls-248e6144.js
          node --check sw.js
          node --check firebase-messaging-sw.js
          node --check scripts/send-notification.js
          node --test scripts/*.test.js
          node tools/test_full_text_search_v5_1_0.js
          node tools/test_notification_banner_v5_1_0.js
          node tools/test_privacy_notification_states_v5_1_0.js
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate study index metadata
        run: |
          python3 tools/generate_studies_json.py --root . --out studies.json --check
          python3 tools/generate_search_index.py --root . --out search-index.json --check

      - name: Validate v5.1.0 release package
        run: python3 tools/validate_release_v5_1_0.py

      - name: Prepare release and check live lessons
        id: release
        run: python3 scripts/release.py prepare --event "$GITHUB_EVENT_NAME"

      - name: Commit and push intentional release files
        if: env.RELEASE_DRY_RUN != 'true' && steps.release.outputs.promoted == 'true' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
          RELEASE_PATHS_FILE: ${{ steps.release.outputs.paths_file }}
        run: python3 scripts/release.py commit --target "$RELEASE_TARGET" --paths-file "$RELEASE_PATHS_FILE"

      - name: Upload reader-only Pages artifact
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
